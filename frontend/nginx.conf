worker_processes auto;
user nginx;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  resolver 127.0.0.11 ipv6=off valid=30s;
  map $uri $qcontrol_cache_control {
    default "no-store";
    ~^/assets/ "no-cache, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    set $control_plane http://control-plane:8080;
    root /usr/share/nginx/html;
    client_max_body_size 16m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control $qcontrol_cache_control always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"qcontrol-web"}'; }
    location = /install-agent.sh { proxy_pass http://control-plane:8080/api/v1/agent-installer; proxy_set_header X-QControlHub-Enrollment $http_x_qcontrolhub_enrollment; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /readyz { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /agent/ { proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass $control_plane; }
    location /assets/ { try_files $uri =404; }
    location ^~ /install-assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
